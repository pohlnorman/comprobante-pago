<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de pago</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
</head>
<body>

    <!-- Pantalla de ingreso de datos -->
    <main id="formView" class="view form-view">
        <section class="form-card">
            <h1>Generar comprobante</h1>
            <p class="subtitle">Ingresa los datos del pago</p>

            <form id="paymentForm">
                <div class="field">
                    <label for="merchant">Comercio</label>
                    <input
                        type="text"
                        id="merchant"
                        name="merchant"
                        placeholder="Ej: Don Mario"
                        required
                        maxlength="80"
                    >
                </div>

                <div class="field">
                    <label for="amount">Precio</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Ej: 6970"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <button type="submit" class="primary-button">
                    Generar
                </button>
            </form>
        </section>
    </main>

    <!-- Pantalla final -->
    <main id="resultView" class="view result-view hidden">

        <section class="success-header">
            <div class="icon-circle">
                <svg class="success-icon" viewBox="0 0 100 100" aria-hidden="true">
                    <path
                        d="M31 39H20C17.8 39 16 40.8 16 43V69C16 71.2 17.8 73 20 73H31V39Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="4"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M31 43H38L45 31V25C45 21.7 47.7 19 51 19C54.3 19 57 21.7 57 25V32H68C73.2 32 77 36.8 75.7 41.8L71.5 61.8C70.6 66 66.9 69 62.6 69H31"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>
        </section>

        <section class="result-content">
            <h1>
                <span class="payment-message">
                    Listo! Realizaste un pago de 
                    <span  id="resultAmount">$0</span >
                </span>

                <span class="merchant-message">
                    al comercio 
                    <span  id="resultMerchant">---</span >
                </span>
            </h1>

            <div class="result-actions">
                <button id="receiptButton" class="receipt-button">
                    Ver Comprobante
                </button>

                <button id="exitButton" class="exit-button">
                    Salir
                </button>
            </div>
        </section>

    </main>

    <!-- Pantalla del comprobante -->
<main id="receiptView" class="view receipt-view hidden">

    <section class="receipt-content">

        <div class="receipt-top">
            <button id="backReceiptButton" class="back-receipt-button">
                ←
            </button>

            <div class="receipt-success-icon">
                ✓
            </div>

            <h1>Transacción exitosa</h1>
        </div>


        <div class="receipt-data">

            <div class="receipt-row">
                <span class="receipt-label">Monto</span>
                <span id="receiptAmount" class="receipt-value">$0</span>
            </div>

            <div class="receipt-row">
                <span class="receipt-label">Nombre</span>
                <span id="receiptMerchant" class="receipt-value">---</span>
            </div>

            <div class="receipt-row">
                <span class="receipt-label">Rut</span>
                <span id="receiptRut" class="receipt-value">15.211.848-1</span>
            </div>

            <div class="receipt-row">
                <span class="receipt-label">Asunto</span>
                <span id="receiptSubject" class="receipt-value"></span>
            </div>

            <hr>

            <div class="receipt-row">
                <span class="receipt-label">Fecha</span>
                <span id="receiptDate" class="receipt-value">--/--/----</span>
            </div>

            <div class="receipt-row">
                <span class="receipt-label">Hora</span>
                <span id="receiptTime" class="receipt-value">--:--:--</span>
            </div>

            <div class="receipt-row">
                <span class="receipt-label">N° de operación</span>
                <span id="receiptOperation" class="receipt-value">--------</span>
            </div>

        </div>


        <div class="receipt-bottom">

            <button class="share-receipt-button">
                ♧ Compartir comprobante
            </button>

            <button class="close-receipt-button">
                Cerrar
            </button>

        </div>

    </section>

</main>

    <script src="app.js"></script>
</body>
</html>
